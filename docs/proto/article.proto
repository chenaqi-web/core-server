syntax = "proto3";

// article service
// 与数据库表 `blog_posts` 字段对应的文章 proto 定义

package article;
option go_package = "core-server/internal/rpc/articlepb;articlepb";

message Article {
  uint64 id = 1;
  string title = 2;
  string summary = 3;
  string content = 4;
  string coverImage = 5;
  uint64 authorID = 6;
  uint64 categoryID = 7;
  bool isTop = 8;
  bool isPublished = 9;
  uint32 visibility = 10;
  uint64 viewCount = 11 ;
  uint64 likeCount = 12;
  uint64 commentCount = 13;
  uint64 createdAt = 14; // unix timestamp (seconds)
  uint64 updatedAt = 15; // unix timestamp (seconds)
  uint64 publishedAt = 16;
  string authorName = 17; // 作者昵称，来自 user.name
  string authorAvatar = 18; // 作者头像，来自 user.avatar
}

message CreateArticleRequest {
  uint64 authorID = 1;
  string title = 2;
  string summary = 3;
  string content = 4;
  string coverImage = 5;
  uint64 categoryID = 6;
  bool isTop = 7;
  bool isPublished = 8;    // 是否发布（true=直接发布, false=存草稿）
  uint32 visibility = 9;   // 可见性：0=私密, 1=公开, 2=仅关注者
}
message CreateArticleResponse {
  bool success = 1;
}

message GetArticleRequest {
  uint64 id = 1;
}
message GetArticleResponse {
  Article article = 1;
}

message ListArticlesRequest {
  uint32 page = 1; // 从 1 开始
  uint32 pageSize = 2;
}
message ListArticlesResponse {
  repeated Article articles = 1;
}

message EditorArticleRequest {
  uint64 id = 1;           // 文章ID
  uint64 authorID = 2;    // 请求者用户ID，用于校验权限
  string title = 3;        // 标题
  string summary = 4;      // 摘要
  string content = 5;      // 正文内容
  string coverImage = 6;   // 封面图
  uint64 categoryID = 7;   // 分类ID
  bool isTop = 8;          // 是否置顶
  bool isPublished = 9;    // 是否发布（true=发布, false=存草稿）
  uint32 visibility = 10;  // 可见性：0=私密, 1=公开, 2=仅关注者
}

message EditorArticleResponse {
  bool success = 1;
  uint64 articleID = 2;    // 文章ID
}

message DeleteArticleRequest {
  uint64 id = 1;
  uint64 authorID = 2; // 请求者用户ID，用于校验是否有权限删除
}
message DeleteArticleResponse {
  bool success = 1;
}

message ListMyArticlesRequest {
  uint64 authorID = 1;
  uint32 page = 2;
  uint32 pageSize = 3;
  optional bool isPublished = 4;  // 不传=全部, true=只看已发布, false=只看草稿
}
message ListMyArticlesResponse {
  repeated Article articles = 1;
}

message ListByCategoryRequest {
  uint64 categoryID = 1;
  uint32 page = 2;
  uint32 pageSize = 3;
}
message ListByCategoryResponse {
  repeated Article articles = 1;
}

message SearchArticlesRequest {
  string q = 1; // keyword
  uint32 page = 2;
  uint32 pageSize = 3;
}
message SearchArticlesResponse {
  repeated Article articles = 1;
}


service ArticleService {
  rpc CreateArticle(CreateArticleRequest) returns (CreateArticleResponse) {};
  rpc EditorArticle(EditorArticleRequest) returns (EditorArticleResponse) {};
  rpc GetArticle(GetArticleRequest) returns (GetArticleResponse) {};
  rpc ListArticles(ListArticlesRequest) returns (ListArticlesResponse) {};
  rpc ListMyArticles(ListMyArticlesRequest) returns (ListMyArticlesResponse) {};
  // 查询某个分类下的文章列表
  rpc ListByCategory(ListByCategoryRequest) returns (ListByCategoryResponse) {};
  // 搜索文章（标题/摘要/正文）
  rpc SearchArticles(SearchArticlesRequest) returns (SearchArticlesResponse) {};
  rpc DeleteArticle(DeleteArticleRequest) returns (DeleteArticleResponse) {};
}





