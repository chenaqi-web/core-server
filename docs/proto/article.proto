syntax = "proto3";

// article service
// 与数据库表 `blog_posts` 字段对应的文章 proto 定义

package article;
option go_package = "backend/core-server/internal/rpc/articlepb;articlepb";

message Article {
  uint64 id = 1;
  string title = 2;
  string summary = 3;
  string content = 4;
  string coverImage = 5;
  uint64 authorID = 6;
  uint64 categoryID = 7;
  bool isTop = 8;
  uint64 viewCount = 9;
  uint64 likeCount = 10;
  uint64 commentCount = 11;
  uint64 createdAt = 12; // unix timestamp (seconds)
  uint64 updatedAt = 13; // unix timestamp (seconds)
}

message CreateArticleRequest {
  uint64 authorID = 1;
  string title = 2;
  string summary = 3;
  string content = 4;
  string coverImage = 5;
  uint64 categoryID = 6;
  bool isTop = 7;
}

message CreateArticleResponse {
  bool success = 1;
}

message GetArticleRequest {
  uint64 id = 1;
}

message GetArticleResponse {
  Article article = 1;
}

message ListArticlesRequest {
  uint32 page = 1; // 从 1 开始
  uint32 pageSize = 2;
}

message ListArticlesResponse {
  repeated Article articles = 1;
  uint64 total = 2;
}

service ArticleService {
  rpc CreateArticle(CreateArticleRequest) returns (CreateArticleResponse) {};
  rpc GetArticle(GetArticleRequest) returns (GetArticleResponse) {};
  rpc ListArticles(ListArticlesRequest) returns (ListArticlesResponse) {};
}

