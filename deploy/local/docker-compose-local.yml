# 本地开发环境配置
# 文件位置: ~/chenaqiweb/backend/docker-compose.local.yml
# 启动：docker compose -f docker-compose.local.yml up -d

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4.7
    container_name: mysql-local
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: renai
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    networks:
      - chenaqi-net-local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: docker.m.daocloud.io/library/redis:7
    container_name: redis-local
    ports:
      - "6379:6379"
    networks:
      - chenaqi-net-local
    restart: unless-stopped

  chroma:
    image: docker.m.daocloud.io/chromadb/chroma:1.5.9
    container_name: chroma-local
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      CHROMA_SERVER_AUTHN_PROVIDER: chromadb.auth.token_authn.TokenAuthenticationServerProvider
      CHROMA_SERVER_AUTHN_CREDENTIALS: qwertyuiopasdfghjklzxcvbnm
      CHROMA_AUTH_TOKEN_TRANSPORT_HEADER: Authorization
    ports:
      - "8000:8000"
    networks:
      - chenaqi-net-local
    restart: unless-stopped

networks:
  chenaqi-net-local:
    name: chenaqi-net-local
    driver: bridge